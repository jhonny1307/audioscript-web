<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Script</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<h2 title="Tool to create, organize and generate audio scripts">🎤AudioScript <span>web</span></h2>
<textarea id="script" rows="6" placeholder="Paste your script here or start creating now...
Create comments using '//' before the comment"></textarea>
<div class="topbar"><button onclick="splitScript()">Split</button><button onclick="clearProject()">Clean</button></div>
<h3 title="Time between tracks in the final audio when generated (1s = 1000ms)">Gap between tracks (ms)</h3>
<input type="number" id="gap" value="0" onchange="updatePreview()">
<div id="parts"></div>
<div class="preview">
<h3 title="Preview of selected audio segments">Preview</h3>
<audio controls id="previewPlayer"></audio>
<div class="previewControls">
<button title="Refresh preview manually" onclick="updatePreview()">🔄</button>
<button title="Choose an export format" onclick="toggleExportMenu()">Export</button>
</div>
<div class="exportMenu" id="exportMenu">
<button onclick="exportMerged(false)">Export Selected Audio</button>
<button onclick="exportMerged(true)">Export All Audio</button>
<button onclick="exportZip(false)">Export Selected ZIP</button>
<button onclick="exportZip(true)">Export All ZIP</button>
</div>
</div>
<hr style="border:0;border-top:1px solid #222;margin-top:40px;">
<footer style="margin-top:20px;font-size:14px;color:#888;text-align:center;">made with AI (chatGPT), <a href="https://github.com/jhonny1307/audioscript-web" target="_blank" style="color:#aaa;">project file (v12.1.5)</a></footer>
<script src="./script.js"></script>
</body>
</html>
